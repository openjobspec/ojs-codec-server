name: Release Readiness

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  GOWORK: "off"
  GOFLAGS: "-mod=readonly"

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5
        with:
          go-version: "1.26.6"
          cache: false
      - name: Validate release tag and metadata
        if: github.ref_type == 'tag'
        run: |
          [[ "${GITHUB_REF_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]
          VERSION="${GITHUB_REF_NAME#v}"
          PACKAGE_VERSION="$(sed -n 's/^VERSION ?= //p' Makefile)"
          test -n "${PACKAGE_VERSION}"
          test "${VERSION}" = "${PACKAGE_VERSION}"
          grep -Fq "## [${VERSION}]" CHANGELOG.md
          grep -Fq "const version = \"${VERSION}\"" cmd/ojs-attest/main.go
      - run: go vet ./...
      - run: go test ./... -race -count=1
      - run: go build ./...
      - run: docker build --build-arg VERSION="$(sed -n 's/^VERSION ?= //p' Makefile)" .
